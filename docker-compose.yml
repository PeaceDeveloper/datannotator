services:
  label-studio:
    # Pin to the image digest used during SQLite→Postgres migration (Label Studio 1.20.0)
    image: heartexlabs/label-studio@sha256:f4481a772b19c6fe0a4577228cc51134deeaaddd463ea96692680c02c04debcc
    container_name: label-studio
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD}
      # - LABEL_STUDIO_USER_TOKEN=${LABEL_STUDIO_USER_TOKEN}
      - ALLOWED_HOSTS=*
      - DJANGO_ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=https://*.trycloudflare.com/
      # Label Studio reads DJANGO_DB + POSTGRE_* (not DATABASE_URL)
      - DJANGO_DB=default
      - POSTGRE_HOST=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_NAME=${POSTGRES_DB}
      - POSTGRE_USER=${POSTGRES_USER}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - label-studio-data:/label-studio/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datannotator-network

  postgres:
    image: postgres:15
    container_name: datannotator-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - datannotator-network

volumes:
  label-studio-data:
    driver: local
  postgres-data:
    driver: local

networks:
  datannotator-network:
    driver: bridge
